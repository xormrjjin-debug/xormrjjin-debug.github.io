<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>페이지를 찾을 수 없습니다 — 김진서</title>
<script>
  // 주소 대소문자가 다르거나(Jinseo) 끝이 잘려도 새 사이트로 보내기
  var p = location.pathname.toLowerCase();
  if (p.indexOf('/jinseo') === 0) location.replace('/jinseo/');
</script>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f2f1ee; color: #0e0e0e;
         font-family: "Pretendard", -apple-system, "Malgun Gothic", sans-serif; text-align: center; padding: 24px; }
  h1 { font-size: 40px; letter-spacing: -0.04em; margin: 0 0 12px; }
  p { color: #8c8b87; margin: 0 0 24px; }
  a { color: #ff4a1c; font-weight: 700; text-decoration: none; }
  @media (prefers-color-scheme: dark) { body { background: #0d0d0d; color: #efeee9; } }
</style>
</head>
<body>
  <div>
    <h1>여긴 아무것도 없습니다.</h1>
    <p>대체로 괜찮습니다. 주소를 한 번만 확인해 주세요.</p>
    <a href="/">홈으로 →</a>
  </div>
</body>
</html>
